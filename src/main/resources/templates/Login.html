<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>My Web App</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 12px;
        width: 420px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
        color: #333;
      }

      p {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      /* Salesforce Login Button */
      .sf-login-btn {
        width: 100%;
        height: 48px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        gap: 10px;
        padding: 0 20px;

        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;

        background: #1b96ff;
        color: #ffffff;
        text-decoration: none;

        box-sizing: border-box;
      }

      .sf-login-btn:hover {
        background: #0176d3;
      }

      .sf-icon {
        height: 18px;
        width: auto;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>My Web App</h1>

      <p>
        Welcome to My Web App. This application allows you to securely connect
        with Salesforce and view important metadata from your organization.
      </p>

      <!-- Salesforce Login Button -->
      <a href="/salesforce/login" class="sf-login-btn">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Salesforce.com_logo.svg"
          alt="Salesforce Logo"
          class="sf-icon"
        />
        Login with Salesforce
      </a>
    </div>
  </body>
</html>
